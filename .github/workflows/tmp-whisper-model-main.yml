name: Temporary Whisper Model Artifact

on:
  pull_request:
    branches: [main]

jobs:
  download-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download multilingual Whisper model
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            --output ggml-small-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin"
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum --check
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
